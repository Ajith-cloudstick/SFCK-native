<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SFCK Field App</title>
		<link rel="icon" href="/favicon.ico" />
		<!--
			Web preview phone frame. web/metro.js serves this page when a browser opens an app route;
			the iframe below loads the real app from the same Expo dev server.
			--status-bar and --gesture-bar must match FRAME_INSETS in shims/safe-area-context.ts.
		-->
		<style>
			:root {
				--screen-w: 392px;
				--screen-h: 852px;
				--bezel: 12px;
				--status-bar: 28px;
				--gesture-bar: 16px;
				--brand-50: #eef7f1;
				--brand-100: #d6ede0;
				--brand-200: #afdbc0;
				--brand-600: #237847;
				--brand-700: #1f6b3b;
				--brand-900: #143f25;
				--muted: #5b6b62;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 72px;
				padding: 32px;
				box-sizing: border-box;
				overflow: hidden;
				font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				background: radial-gradient(circle at 30% 20%, var(--brand-50) 0%, var(--brand-100) 55%, var(--brand-200) 100%);
			}
			.caption {
				max-width: 360px;
			}
			.eyebrow {
				font-size: 13px;
				font-weight: 600;
				letter-spacing: 1.2px;
				text-transform: uppercase;
				color: var(--brand-600);
			}
			h1 {
				margin: 8px 0 16px;
				font-size: 40px;
				line-height: 1.1;
				color: var(--brand-900);
			}
			.caption p {
				margin: 0 0 12px;
				font-size: 16px;
				line-height: 1.55;
				color: var(--muted);
			}
			.caption a {
				display: inline-block;
				margin-top: 8px;
				font-size: 14px;
				font-weight: 600;
				color: var(--brand-700);
			}
			@media (max-width: 999px) {
				.caption {
					display: none;
				}
			}
			.slot {
				flex-shrink: 0;
			}
			.phone {
				position: relative;
				width: calc(var(--screen-w) + var(--bezel) * 2);
				height: calc(var(--screen-h) + var(--bezel) * 2);
				padding: var(--bezel);
				box-sizing: border-box;
				border-radius: 52px;
				background: #111312;
				box-shadow: 0 0 0 2px #2a2d2b, 0 30px 80px rgba(11, 38, 22, 0.35), 0 8px 24px rgba(11, 38, 22, 0.25);
				transform-origin: top left;
			}
			.side-button {
				position: absolute;
				right: -4px;
				width: 4px;
				border-radius: 0 3px 3px 0;
				background: #2a2d2b;
			}
			.screen {
				position: relative;
				width: var(--screen-w);
				height: var(--screen-h);
				border-radius: 40px;
				overflow: hidden;
				background: var(--brand-700);
			}
			iframe {
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
			}
			.status-bar {
				position: absolute;
				inset: 0 0 auto 0;
				height: var(--status-bar);
				padding: 0 26px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				color: #fff;
				font-size: 13px;
				font-weight: 600;
				pointer-events: none;
			}
			.punch-hole {
				position: absolute;
				left: 50%;
				top: 8px;
				width: 12px;
				height: 12px;
				margin-left: -6px;
				border-radius: 50%;
				background: #050505;
			}
			.icons {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.gesture-area {
				position: absolute;
				inset: auto 0 0 0;
				height: var(--gesture-bar);
				display: flex;
				align-items: center;
				justify-content: center;
				pointer-events: none;
			}
			/* difference blending keeps the pill visible on light screens and on the black scanner */
			.gesture-bar {
				width: 108px;
				height: 4px;
				border-radius: 2px;
				background: #fff;
				mix-blend-mode: difference;
			}
		</style>
		<script>
			// A phone browser (narrow window) gets the app full screen instead of a phone inside a phone
			if (window.innerWidth < 600) {
				const url = new URL(window.location.href);
				url.searchParams.set("frame", "off");
				window.location.replace(url.toString());
			}
		</script>
	</head>
	<body>
		<div class="caption">
			<div class="eyebrow">Live preview</div>
			<h1>SFCK Field App</h1>
			<p>The real mobile app running in the browser, connected to the SFCK server. Sign in, pick a centre and mark attendance just like on a phone.</p>
			<p>Scan ID cards with this computer's webcam, or tap Enter ID and type the worker's number.</p>
			<a id="full-window" href="?frame=off">Open without the phone frame</a>
		</div>

		<div class="slot" id="slot">
			<div class="phone" id="phone">
				<span class="side-button" style="top: 150px; height: 64px"></span>
				<span class="side-button" style="top: 240px; height: 110px"></span>
				<div class="screen">
					<iframe id="app" title="SFCK Field App" allow="camera; clipboard-write"></iframe>
					<div class="status-bar">
						<span id="clock"></span>
						<span class="punch-hole"></span>
						<span class="icons" aria-hidden="true">
							<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M15 0v12H1z" /></svg>
							<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 0 3.6a11.5 11.5 0 0 1 16 0z" /></svg>
							<svg width="9" height="14" viewBox="0 0 9 14" fill="currentColor">
								<rect x="2.5" y="0" width="4" height="2" rx="0.5" />
								<rect x="0" y="1.5" width="9" height="12.5" rx="1.5" />
							</svg>
						</span>
					</div>
					<div class="gesture-area"><span class="gesture-bar"></span></div>
				</div>
			</div>
		</div>

		<script>
			const phone = document.getElementById("phone");
			const slot = document.getElementById("slot");
			const clock = document.getElementById("clock");

			// Same address as this page (/preview means the app's start); the iframe request gets the app
			const appPath = window.location.pathname === "/preview" ? "/" : window.location.pathname;
			document.getElementById("app").src = appPath + window.location.search;
			document.getElementById("full-window").href = appPath + "?frame=off";

			function tick() {
				const now = new Date();
				clock.textContent = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, "0")}`;
			}

			// Shrink the whole phone (app included) to fit short screens such as projectors
			function fit() {
				const width = phone.offsetWidth;
				const height = phone.offsetHeight;
				const scale = Math.min(1, (window.innerHeight - 64) / height, (window.innerWidth - 64) / width);
				phone.style.transform = `scale(${scale})`;
				slot.style.width = `${width * scale}px`;
				slot.style.height = `${height * scale}px`;
			}

			tick();
			fit();
			setInterval(tick, 10000);
			window.addEventListener("resize", fit);
		</script>
	</body>
</html>
